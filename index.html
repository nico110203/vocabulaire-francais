<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocabulaire Édito A1</title>
<meta name="description" content="Vocabulaire des unités 0 à 2 d'Édito A1 : tableau et flashcards.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇫🇷</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="titlebar">
      <h1><span data-i18n="title">Vocabulaire</span> <em>Édito A1</em></h1>
      <div class="lang" role="group" aria-label="Langue / Language / 語言">
        <button data-lang="fr">FR</button>
        <button data-lang="en">EN</button>
        <button data-lang="zh">中文</button>
      </div>
    </div>
    <p class="sub" data-i18n="subtitle"></p>
    <nav class="tabs" role="tablist">
      <button role="tab" data-mode="table" data-i18n="tabTable" aria-selected="true"></button>
      <button role="tab" data-mode="cards" data-i18n="tabCards" aria-selected="false"></button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="filters">
    <div class="units" id="units"></div>
    <div class="row">
      <select id="theme" data-i18n-label="theme"></select>
    </div>
  </section>

  <section id="tableView">
    <input type="search" id="search" data-i18n-placeholder="search">
    <div id="tables"></div>
  </section>

  <section id="cardsView" hidden>
    <div class="row cardopts">
      <select id="direction" data-i18n-label="direction">
        <option value="fr" data-i18n="dirFr"></option>
        <option value="other" data-i18n="dirOther"></option>
      </select>
      <button class="ghost" id="shuffle" data-i18n="shuffle"></button>
    </div>
    <p class="progress" id="progress"></p>
    <div class="card" id="card" tabindex="0" aria-live="polite">
      <div class="inner">
        <div class="face front" id="front"></div>
        <div class="face back" id="back"></div>
      </div>
    </div>
    <div class="nav">
      <button class="ghost" id="prev" aria-label="←">←</button>
      <button class="again" id="again" data-i18n="again"></button>
      <button class="known" id="known" data-i18n="known"></button>
      <button class="ghost" id="next" aria-label="→">→</button>
    </div>
    <div class="done" id="done" hidden>
      <p id="doneText"></p>
      <div class="row center">
        <button class="again" id="redoMissed" data-i18n="redoMissed"></button>
        <button class="ghost" id="restart" data-i18n="restart"></button>
      </div>
    </div>
    <p class="keys" data-i18n="keys"></p>
  </section>
</main>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
